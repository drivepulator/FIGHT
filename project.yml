name: FIGHT
options:
  bundleIdPrefix: com.shon
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "1"

# IMPORTANT: there is intentionally NO `info:` block on either target.
# XcodeGen's `info:` block REGENERATES (overwrites) the plist at that path,
# which would wipe the Bluetooth usage strings, background modes and
# NSExtension from the committed plists. Pointing INFOPLIST_FILE at the files
# and leaving `info:` out makes the committed Info.plist files the single
# source of truth.

targets:
  FIGHT:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
      - path: Sources/Shared
      # Shared plan format; a future FIGHT Coach app target will compile this too.
      - path: Sources/PlanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shon.fight
        PRODUCT_NAME: FIGHT
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FIGHTWidget
        embed: true

  FIGHTWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shon.fight.widget
        PRODUCT_NAME: FIGHTWidget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  FIGHTTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/FIGHTTests
      - path: Sources/App/Models.swift
      - path: Sources/App/HRVMath.swift
      - path: Sources/App/CoachEngine.swift
      - path: Sources/App/CampPlanner.swift
      - path: Sources/App/BagCoach.swift
      - path: Sources/App/PlanSupport.swift
      - path: Sources/App/Insights.swift
      - path: Sources/App/HeadMotionTracker.swift
      - path: Sources/App/ImpactDetector.swift
      - path: Sources/App/Plyo.swift
      - path: Sources/App/Encouragement.swift
      - path: Sources/App/RouteMath.swift
      - path: Sources/App/WorkoutMenu.swift
      - path: Sources/App/HoldCountdown.swift
      - path: Sources/PlanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shon.fight.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FIGHT:
    build:
      targets:
        FIGHT: all
  FIGHTTests:
    build:
      targets:
        FIGHTTests: [test]
    test:
      config: Debug
      targets:
        - FIGHTTests
